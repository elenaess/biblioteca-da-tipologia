name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-apk
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run reader:bundle
      - run: npm ci --prefix apps/mobile
      - run: npm run typecheck --prefix apps/mobile
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
        working-directory: apps/mobile
        env:
          CI: '1'
          EXPO_OFFLINE: '1'
      - name: Build standalone release APK
        run: ./gradlew app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a -Pexpo.useLegacyPackaging=true
        working-directory: apps/mobile/android
        env:
          NODE_ENV: production
          EXPO_OFFLINE: '1'
      - name: Prepare APK
        run: cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk Biblioteca-da-Tipologia-1.1.0-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Biblioteca-da-Tipologia-APK
          path: Biblioteca-da-Tipologia-1.1.0-arm64.apk
          if-no-files-found: error
          retention-days: 30
