name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install JavaScript dependencies
        run: npm install
        working-directory: apps/mobile
      - name: Align Expo SDK dependencies
        run: npx expo install --fix --non-interactive
        working-directory: apps/mobile
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --non-interactive
        working-directory: apps/mobile
      - name: Build installable debug APK
        run: ./gradlew assembleDebug
        working-directory: apps/mobile/android
      - name: Rename APK
        run: cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk Biblioteca-da-Tipologia.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Biblioteca-da-Tipologia-APK
          path: Biblioteca-da-Tipologia.apk
          if-no-files-found: error
