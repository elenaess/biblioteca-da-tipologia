name: Verificar biblioteca
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run reader:bundle
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm ci --prefix apps/mobile
      - run: npm run typecheck --prefix apps/mobile
      - run: npm run export --prefix apps/mobile
        env:
          EXPO_OFFLINE: "1"
